<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Recipe | CookMate</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            min-height:100vh;

            background:
            linear-gradient(rgba(245,245,245,0.92),
            rgba(245,245,245,0.95)),
            url('https://images.unsplash.com/photo-1498837167922-ddd27525d352?q=80&w=1974&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            color:#222;
        }

        /* NAVBAR */

        .navbar{

            width:100%;

            padding:22px 70px;

            background:white;

            display:flex;
            justify-content:space-between;
            align-items:center;

            box-shadow:0 2px 15px rgba(0,0,0,0.08);

            position:sticky;
            top:0;
            z-index:100;
        }

        .logo{

            font-size:34px;
            font-weight:700;
            color:#ff6b35;
        }

        .nav-links{

            display:flex;
            gap:35px;
        }

        .nav-links a{

            text-decoration:none;
            color:#333;
            font-weight:500;
            transition:0.3s;
        }

        .nav-links a:hover{

            color:#ff6b35;
        }

        .logout-btn{

    background:none;

    border:none;

    cursor:pointer;

    color:#333;

    font-weight:500;

    font-size:15px;

    transition:0.3s;
}

.logout-btn:hover{

    color:#ff6b35;
}

        /* HERO */

        .hero{

            width:90%;
            margin:40px auto 20px auto;

            text-align:center;
        }

        .hero h1{

            font-size:56px;
            margin-bottom:15px;
            color:#222;
        }

        .hero span{

            color:#ff6b35;
        }

        .hero p{

            font-size:18px;
            color:#666;
        }

        /* FORM CONTAINER */

        .form-container{

            width:92%;

            max-width:1100px;

            margin:30px auto 70px auto;

            background:white;

            padding:45px;

            border-radius:32px;

            box-shadow:0 15px 40px rgba(0,0,0,0.10);
        }

        /* GRID */

        .form-grid{

            display:grid;
            grid-template-columns:1fr 1fr;
            gap:25px;
        }

        .full-width{

            grid-column:1 / -1;
        }

        /* INPUTS */

        .input-group{

            display:flex;
            flex-direction:column;
        }

        .input-group label{

            margin-bottom:10px;

            font-size:15px;
            font-weight:600;

            color:#333;
        }

        .input-group input,
        .input-group textarea,
        .input-group select{

            width:100%;

            padding:16px 18px;

            border:1px solid #e5e7eb;

            border-radius:16px;

            background:#f9fafb;

            font-size:15px;

            outline:none;

            transition:0.3s;
        }

        .input-group textarea{

            resize:none;

            min-height:130px;
        }

        .input-group input:focus,
        .input-group textarea:focus,
        .input-group select:focus{

            border-color:#ff6b35;

            background:white;

            box-shadow:0 0 0 4px rgba(255,107,53,0.10);
        }

        /* FILE BOX */

        .file-box{

            border:2px dashed #d1d5db;

            border-radius:22px;

            padding:35px;

            text-align:center;

            background:#fafafa;

            transition:0.3s;
        }

        .file-box:hover{

            border-color:#ff6b35;

            background:#fff7f4;
        }

        .file-box input{

            margin-top:18px;
        }

        /* SECTION TITLE */

        .section-title{

            font-size:24px;
            font-weight:700;

            margin-bottom:25px;

            color:#222;
        }

        /* BUTTON */

        .submit-btn{

            width:100%;

            margin-top:35px;

            padding:18px;

            border:none;

            border-radius:18px;

            background:linear-gradient(
                135deg,
                #ff6b35,
                #ff8e53
            );

            color:white;

            font-size:17px;
            font-weight:600;

            cursor:pointer;

            transition:0.35s;
        }

        .submit-btn:hover{

            transform:translateY(-3px);

            box-shadow:0 12px 25px rgba(255,107,53,0.25);
        }

        /* RESPONSIVE */

        @media(max-width:850px){

            .form-grid{

                grid-template-columns:1fr;
            }

            .hero h1{

                font-size:42px;
            }

            .navbar{

                flex-direction:column;
                gap:18px;
            }

            .form-container{

                padding:30px;
            }
        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">

            🍳 CookMate

        </div>

        <div class="nav-links">

            <a href="/landing/">

                Home

            </a>

            <a href="/home/">

                Recommendations

            </a>

            <a href="/favorites/">

                Favorites

            </a>

            <a href="/add-recipe/">

                Add Recipe

            </a>

            <form
    action="/logout/"
    method="POST"
    style="display:inline;"
>

    {% csrf_token %}

    <button
        type="submit"
        class="logout-btn"
    >

        Logout

    </button>

</form>

        </div>

    </div>

    <!-- HERO -->

    <div class="hero">

        <h1>

            Add Your
            <span>Recipe</span>

        </h1>

        <p>

            Share delicious recipes with the CookMate community

        </p>

    </div>

    <!-- FORM -->

    <div class="form-container">

        <div class="section-title">

            🍽 Recipe Information

        </div>

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}

            <div class="form-grid">

                <!-- NAME -->

                <div class="input-group">

                    <label>

                        Recipe Name

                    </label>

                    <input
                        type="text"
                        placeholder="Enter recipe name"
                    >

                </div>

                <!-- COOKING TIME -->

                <div class="input-group">

                    <label>

                        Cooking Time

                    </label>

                    <input
                        type="number"
                        placeholder="Minutes"
                    >

                </div>

                <!-- DIFFICULTY -->

                <div class="input-group">

                    <label>

                        Difficulty

                    </label>

                    <select>

                        <option>

                            Easy

                        </option>

                        <option>

                            Medium

                        </option>

                        <option>

                            Hard

                        </option>

                    </select>

                </div>

                <!-- CUISINE -->

                <div class="input-group">

                    <label>

                        Cuisine Type

                    </label>

                    <input
                        type="text"
                        placeholder="Indian, Italian..."
                    >

                </div>

                <!-- INGREDIENTS -->

                <div class="input-group full-width">

                    <label>

                        Ingredients

                    </label>

                    <textarea
                        placeholder="Enter ingredients separated by commas"
                    ></textarea>

                </div>

                <!-- INSTRUCTIONS -->

                <div class="input-group full-width">

                    <label>

                        Cooking Instructions

                    </label>

                    <textarea
                        placeholder="Write step-by-step cooking instructions"
                    ></textarea>

                </div>

                <!-- IMAGE -->

                <div class="input-group full-width">

                    <label>

                        Recipe Image

                    </label>

                    <div class="file-box">

                        📸 Upload recipe image

                        <br>

                        <input type="file">

                    </div>

                </div>

                <!-- NUTRITION -->

                <div class="input-group">

                    <label>

                        Calories

                    </label>

                    <input
                        type="number"
                        placeholder="Calories"
                    >

                </div>

                <div class="input-group">

                    <label>

                        Protein

                    </label>

                    <input
                        type="number"
                        placeholder="Protein"
                    >

                </div>

                <div class="input-group">

                    <label>

                        Carbs

                    </label>

                    <input
                        type="number"
                        placeholder="Carbs"
                    >

                </div>

                <div class="input-group">

                    <label>

                        Fats

                    </label>

                    <input
                        type="number"
                        placeholder="Fats"
                    >

                </div>

            </div>

            <!-- BUTTON -->

            <button
                type="submit"
                class="submit-btn"
            >

                Save Recipe

            </button>

        </form>

    </div>

</body>

</html>
