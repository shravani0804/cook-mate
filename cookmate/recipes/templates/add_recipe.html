<!DOCTYPE html>
<html>

<head>

    <title>Add Recipe</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 40px;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 20px;
            color: #ff5e62;
            text-align: center;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #ff5e62;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #e14a4f;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>➕ Add Recipe</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <label>
            Ingredients
        </label>

        <input
            type="text"
            name="ingredients"
            placeholder="Enter ingredients separated by commas"
            required
        >

        <button type="submit">
            Save Recipe
        </button>

    </form>

</div>

</body>
</html>
