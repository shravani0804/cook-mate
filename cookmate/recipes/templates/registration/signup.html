<!DOCTYPE html>
<html>

<head>

    <title>Signup</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f4f6f9;
            padding: 50px;
        }

        .box {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #ff5e62;
            color: white;
            border: none;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>Create Account</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Signup
        </button>

    </form>

    <br>

    <a href="/accounts/login/">
        Already have an account?
    </a>

</div>

</body>
</html>
